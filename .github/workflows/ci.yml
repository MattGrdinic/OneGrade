name: CI

# Two triggers only, by design (user's call, 2026-08-02): the gate into `main`, and the
# release. `push: ["**"]` plus an unfiltered `pull_request` fired twice for one commit on
# a PR'd branch — the v1.1.1 tag produced 7 runs where 3 were wanted.
#
# What this deliberately does NOT build, so nobody re-adds it as a "fix":
#   - pushes to working branches (task branches and feature/<version>)
#   - PRs into feature/<version>, i.e. the first hop of the branch flow
#   - the merge commit on `main` — `main` is green because its PR was green
# So a sub-feature is verified when its release branch opens a PR into `main`, not before.
# Run `make test` locally while working; that's the fast loop anyway.
on:
  push:
    tags: ["v*"]          # the release trigger — see "Cutting a release" in README.md
  pull_request:
    branches: [main]      # the gate into main: build + test before it can merge

# A new push to a PR makes the in-flight run for that branch obsolete; cancel it rather
# than let both finish. Never cancels main or a tag: a killed `v*` run means no release
# artifacts, and the concurrency key alone can't tell those apart.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      name: macos }
          # Pinned, not windows-latest: that moved to VS 2026 in June 2026, and a
          # CUDA toolkit only accepts host MSVC versions it knows about (nvcc hard-
          # errors otherwise). VS 2022 + CUDA 13.2 is the combination validated on
          # real hardware. Revisit when CUDA officially supports the VS 2026 host.
          - { os: windows-2022,  name: windows }
    steps:
      - uses: actions/checkout@v4

      # The full toolkit, deliberately: no sub-packages list. Trimming it to
      # nvcc/cudart/visual_studio_integration left cuda_runtime.h without the
      # include/crt headers it pulls in ("Cannot open include file:
      # 'crt/host_config.h'"). The extra install minutes beat guessing which
      # sub-package a header hides in.
      #
      # Must stay on CUDA 13.x: -arch=all-major only emits SASS for the archs the
      # toolkit knows, and 12.x stops at sm_90 — a 12.x build ships no code for
      # Blackwell (sm_120), leaving Resolve to render the node on the CPU.
      #
      # This also supplies OpenCL (headers + OpenCL.lib), so there is no vcpkg
      # step: vcpkg resolved to its *debug* OpenCL.lib in a Release build, and
      # this matches the local setup the CUDA path was validated against.
      - name: Install CUDA (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'
          method: 'network'

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # No vcpkg toolchain: OpenCL comes from the CUDA toolkit installed above.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_CUDA=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # A CUDA-less plugin still loads and renders — Resolve just silently falls
      # back to the CPU — so nothing above would fail. Assert the shipped bundle
      # really carries device code, including Blackwell (sm_120).
      - name: Verify CUDA kernel is in the bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          $ofx = "build\OneGrade.ofx.bundle\Contents\Win64\OneGrade.ofx"
          $elf = & "$env:CUDA_PATH\bin\cuobjdump.exe" --list-elf $ofx
          Write-Host $elf
          if (-not ($elf | Select-String -Quiet 'sm_120')) {
            Write-Error "No sm_120 device code in $ofx - Resolve would render on the CPU."
            exit 1
          }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cp install/install-macos.command build/
          ( cd build && zip -r -y OneGrade-macos.zip OneGrade.ofx.bundle install-macos.command )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item install\install-windows.bat build\
          Compress-Archive -Path build\OneGrade.ofx.bundle,build\install-windows.bat -DestinationPath build\OneGrade-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OneGrade-${{ matrix.name }}
          path: build/OneGrade-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
